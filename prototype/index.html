<script>
/* App surfaces built from shared demo state. The settings and session views never own separate memories. */
(() => {
 const O=window.OC, {s,esc,icon,badge,statusTag,canWrite,dirty,find,nextUsed}=O;
 const B=(a,t,cls='',extra='',i='')=>'<button type="button" class="'+cls+'" data-action="'+a+'" '+extra+'>'+(i?icon(i):'')+t+'</button>';

 const disabled=()=>canWrite()?'':'disabled';

 function header(){return '<header class="app-header"><div class="breadcrumb">'+(s.surface==='chat'?'<span class="hide-narrow">示例项目</span><span class="hide-narrow">/</span><b>接口设计复盘</b>':'<span>设置</span><span>/</span><span>插件</span><span>/</span><b>agentOS context</b>')+'</div>'+(s.surface==='chat'?'<nav class="chat-tabs" aria-label="会话视图">'+B('chat-close','对话','tab '+(!s.drawer?'active':''))+B('drawer-open',icon('memory')+'记忆 <span class="counter">'+(['denied','traceUnavailable'].includes(s.demoState)?'—':s.used.length)+'</span>','tab '+(s.drawer?'active':''),'id="memory-trigger" '+(s.demoState==='disabled'?'disabled':''))+'</nav>':'')+badge('仅本地原型','','lock')+'</header>';}
 function stateScreen(){const m={traceUnavailable:['memory','本轮引用暂不可追踪','相关记忆不等于已注入的记忆。未取得真实引用记录时，不显示伪造的引用清单。','恢复演示追踪'],sourceUnavailable:['lock','原始来源当前不可访问','不能展示未授权原文，也不能用摘要冒充原文。请由来源所有者核对权限。','恢复示例来源'],loading:['memory','正在整理记忆','后台提炼不应阻塞对话。此处可模拟完成加载。','模拟加载完成'],empty:['memory','从一条重要的事开始','记忆会在你明确保存，或开启允许的自动捕获后出现。','载入示例资料'],error:['alert','暂时无法读取记忆','示例错误：读取超时。没有保存任何更改，可重试。','重试读取'],denied:['lock','没有此范围的查看权限','不展示节点、关系、数量或证据摘要。图谱关系不会扩大权限。','恢复演示权限'],disabled:['memory','agentOS context 当前未启用','现有对话仍可继续。开启插件后恢复记忆浏览与召回。','模拟启用']}[s.demoState];if(!m)return '';return '<section class="panel state-screen" role="status"><div class="intro-symbol">'+icon(m[0])+'</div><h2>'+m[1]+'</h2><p>'+m[2]+'</p>'+(s.demoState==='loading'?'<div class="skeleton"></div><div class="skeleton short"></div>':'')+B('restore',m[3],'primary')+'</section>';}

 function settings(){const n=s.memory.filter(m=>m.status==='confirmed').length;return '<div class="scroll-area"><main class="page" data-screen-label="设置中的 agentOS context 配置"><div class="page-heading"><div><h1>agentOS context 记忆库</h1><p>自动记忆、关联理解与召回设置</p></div>'+badge('原型 v1.1 · 沿用 DSH 风格','','layers')+'</div>'+offline()+(stateScreen()||'<div class="intro-grid"><section class="panel panel-pad"><div class="row" style="margin-bottom:22px"><span class="intro-symbol">'+icon('memory')+'</span><div class="grow"><h2>记忆设置</h2><p class="footnote">保留原始依据，按对象整理长期记忆。</p></div>'+badge('已启用','green','check')+'</div>'+settingSwitch('capture','自动记忆','捕获允许范围内的重要信息；关闭不会删除已有记忆。',true)+settingSwitch('distill','写入前提炼','提取事实、决策与约束；保留来源，不把回答当成证据。')+'<div class="settings-row"><div><h3>提炼模型</h3><p>只用于整理；不改变当前对话模型。</p></div><select id="distill-model" aria-label="提炼模型" '+disabled()+'><option value="follow" '+(s.draft.model==='follow'?'selected':'')+'>跟随会话模型</option><option value="designated" '+(s.draft.model==='designated'?'selected':'')+'>指定模型（演示）</option></select></div>'+settingSwitch('ontology','关联理解','按类型、关系与约束组织记忆；只在有依据时建立正式关系。')+settingSwitch('recall','回答时使用记忆','按问题召回相关且有效的信息，与自动捕获分开控制。')+'</section><div class="stack"><section class="panel panel-pad"><div class="row between"><h3>记忆管理</h3>'+icon('graph')+'</div><p class="footnote" style="margin-top:9px">一个地方，查记忆、看关系、核对依据。</p><div class="metric-row"><div class="metric"><strong>'+s.memory.length+'</strong><span>演示记忆</span></div><div class="metric"><strong>'+n+'</strong><span>来源已核对</span></div><div class="metric"><strong>'+countReview()+'</strong><span>需要你确认</span></div></div>'+B('workbench','打开记忆工作台','primary','data-view="memories" style="width:100%"','arrow')+'<p class="footnote" style="margin-top:11px">和对话上方的“记忆”使用同一份数据，不重复维护。</p></section><section class="panel panel-pad"><h3>使用说明</h3><div class="stack tight" style="margin-top:16px"><div class="row small">'+icon('check')+'默认只看当前有效记忆</div><div class="row small">'+icon('file')+'点击结论即可核对原文</div><div class="row small">'+icon('clock')+'历史与推断不会冒充当前事实</div></div></section><div class="soft-note">'+icon('shield')+'<span>原型使用虚构数据。开关和修改只影响本次演示，不写入真实记忆。</span></div></div></div><section class="panel panel-pad" style="margin-top:18px"><details><summary>高级设置与本体管理</summary><div class="stack tight" style="margin-top:12px"><p class="footnote">类型、关系与规则仅面向需要治理知识的用户；日常对话无需理解本体术语。</p><div class="row wrap">'+B('workbench','类型与关系','', 'data-view="settings" data-advanced="true"','graph')+B('workbench','范围、隐私与审计','','data-view="settings"','shield')+'</div><p class="footnote">凭据继续由 DSH 统一管理，原型不收集、不显示、不修改密钥。</p></div></details></section>')+'</main></div>'+(dirty()?'<footer class="save-bar"><span class="muted">有尚未保存的设置 · 仅影响演示</span>'+B('config-cancel','取消更改')+B('config-save','保存设置','primary',disabled())+'</footer>':'');}
 function settingSwitch(k,title,desc,first=false){return '<div class="settings-row '+(first?'first':'')+'"><div class="grow"><h3>'+title+'</h3><p>'+desc+'</p></div><button type="button" role="switch" aria-label="'+title+'" aria-checked="'+s.draft[k]+'" class="switch" data-action="config-toggle" data-key="'+k+'" '+disabled()+'></button></div>';}
 function workspace(){const nav=[['memories','记忆','memory'],['graph','图谱','graph'],['review','待确认','alert'],['settings','设置','settings']];return '<div class="workspace-header"><div class="workspace-title"><span class="intro-symbol">'+icon('memory')+'</span><div class="grow"><h1>记忆工作台</h1><p class="footnote">查清一件事，从记忆到关系，再到依据。</p></div>'+B('workspace-back',s.returnFrom==='chat'?'返回当前对话':'返回插件设置','ghost','','back')+'</div><nav class="primary-tabs" aria-label="记忆工作台导航">'+nav.map(([k,t,i])=>B('view',icon(i)+t+(k==='review'&&countReview()>0?'<span class="counter">'+countReview()+'</span>':''),'tab '+(s.view===k?'active':''),'data-view="'+k+'" aria-current="'+(s.view===k?'page':'false')+'"')).join('')+'</nav></div><main class="workspace-body" data-screen-label="'+({memories:'记忆浏览',graph:'本体图谱',review:'待确认',settings:'记忆设置'}[s.view])+'">'+offline()+(stateScreen()||(s.view==='memories'?memoryPage():s.view==='graph'?O.graphPage():s.view==='review'?O.reviewPage():O.advancedPage()))+'</main>';}
 function memoryPage(){const rows=s.memory.filter(m=>(s.scope==='all'||m.scope===s.scope)&&(s.status==='all'||m.status===s.status)&&(!s.query||(m.title+' '+m.entity+' '+m.source+' '+m.type).toLowerCase().includes(s.query.toLowerCase())));return '<div class="filter-bar"><div class="search-box">'+icon('search')+'<input id="memory-query" aria-label="搜索记忆或对象" placeholder="搜索记忆、对象或关键词" value="'+esc(s.query)+'"></div>'+B('search','搜索')+B('clear-filters','清除筛选','ghost')+'<select id="memory-scope" aria-label="记忆范围">'+[['all','全部可见范围'],['Atlas 项目','Atlas 示例项目'],['个人偏好','个人偏好']].map(([v,t])=>'<option value="'+v+'" '+(s.scope===v?'selected':'')+'>'+t+'</option>').join('')+'</select><select id="memory-status" aria-label="记忆状态">'+[['all','所有状态'],['confirmed','来源已核对'],['disputed','存在冲突'],['pending','推断待确认'],['historical','历史记录'],['retired','停止召回']].map(([v,t])=>'<option value="'+v+'" '+(s.status===v?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="sub-toolbar"><div class="segmented" aria-label="记忆展示方式">'+[['list','记忆列表','list'],['entities','对象档案','layers'],['sources','来源资料','file']].map(([v,t,i])=>B('subview',icon(i)+t,s.subview===v?'active':'','data-subview="'+v+'"')).join('')+'</div>'+B('add','记住一条','primary',disabled(),'plus')+'</div>'+(s.subview==='entities'?entityCards():s.subview==='sources'?sourceCards():rows.length===0?'<div class="panel state-screen">'+icon('search')+'<h2>没有找到相关记忆</h2><p>试试对象名称，或清除筛选条件。</p>'+B('clear-filters','清除筛选')+'</div>':'<section class="panel" style="overflow:hidden"><table class="memory-table"><thead><tr><th>记忆</th><th>对象 / 范围</th><th>依据状态</th><th>更新</th></tr></thead><tbody>'+rows.map(m=>'<tr><td class="title-cell">'+B('evidence',esc(m.title),'memory-title','data-id="'+m.id+'"')+'<div class="memory-meta">'+badge(m.type)+'<span>'+esc(m.source)+'</span></div></td><td><div>'+esc(m.entity)+'</div><div class="memory-meta">'+esc(m.scope)+'</div></td><td>'+statusTag(m)+'<div class="memory-meta">'+esc(m.basis)+'</div></td><td class="muted">'+m.date+'</td></tr>').join('')+'</tbody></table><div class="table-foot"><span>'+rows.length+' 条演示记忆 · 点击标题查看依据与版本</span><span>“来源已核对”不等于实现或验收通过</span></div></section>')+'<p class="footnote" style="margin-top:14px">'+icon('shield')+' 已保存、是否有依据、是否用于本轮回答，是三个独立状态。</p>';}
 function entityCards(){return '<div class="entity-grid">'+s.entities.filter(e=>!s.query||(e.name+e.desc+e.aliases.join(' ')).includes(s.query)).map(e=>B('entity','<span class="entity-icon">'+icon(e.icon)+'</span><span class="badge-row">'+badge(e.type,'blue')+badge('同一规范身份')+'</span><span class="entity-name">'+esc(e.name)+'</span><p>'+esc(e.desc)+'</p><span class="small muted">'+(e.aliases.length?e.aliases.length+' 个别名':'暂无别名')+' · 查看档案 '+icon('arrow')+'</span>','panel entity-card','data-id="'+e.id+'"')).join('')+'</div>';}
 function sourceCards(){const groups=[...new Set(s.memory.filter(m=>m.evidence).map(m=>m.evidence))];return '<div class="entity-grid">'+groups.map(id=>{const matches=s.memory.filter(m=>m.evidence===id);return B('evidence','<span class="entity-icon">'+icon('file')+'</span>'+badge('演示原始资料')+'<span class="entity-name">'+esc(matches[0].source)+'</span><p>'+id+' · 支持 '+matches.length+' 条主张</p><span class="small muted">可展开原文、定位片段与版本</span>','panel entity-card','data-id="'+matches[0].id+'"');}).join('')+'</div>';}
 function chat(){const answer='<p>根据本次引用的记忆，重置前需要注意三件事：</p><ol class="check-list"><li><b>明确确认。</b> 用户未二次确认时，不应执行重置。 '+B('evidence','1','cite','data-id="m1" aria-label="查看引用 1 的证据"')+'</li><li><b>检查归属。</b> 确认工作区在当前项目和使用者的授权范围内。 '+B('evidence','2','cite','data-id="m2" aria-label="查看引用 2 的证据"')+'</li><li><b>补齐验收证据。</b> 资料写明恢复后要验收，但当前没有通过记录。 '+B('evidence','3','cite','data-id="m3" aria-label="查看引用 3 的证据"')+'</li></ol><p>因此，我能确认的是<b>已收录的要求</b>，还不能据此判断“已经实现”或“可以上线”。</p><div class="answer-source">'+B('drawer-open',icon('memory')+'本轮引用 '+s.used.length+' 条','source-chip')+badge('演示回答 · 非实时生成')+'</div>';return '<div class="chat-scroll '+(s.drawer?'has-drawer':'')+'" data-screen-label="会话及本轮记忆抽屉"><div class="chat-message user"><div class="user-bubble">重置工作区前，有哪些必须满足的条件？</div></div><div class="chat-message"><div class="avatar">'+icon('memory')+'</div><div class="assistant-text">'+(s.demoState==='denied'?'<p>该范围的记忆不可见，演示回答与来源已隐藏。</p>':answer)+'</div></div>'+s.extraMessages.map(m=>'<div class="chat-message '+(m.role==='user'?'user':'')+'">'+(m.role==='user'?'<div class="user-bubble">'+esc(m.text)+'</div>':'<div class="avatar">'+icon('memory')+'</div><div class="assistant-text">'+esc(m.text)+'</div>')+'</div>').join('')+'</div><div class="composer '+(s.drawer?'has-drawer':'')+'"><label class="sr-only" for="chat-input">演示对话输入</label><textarea id="chat-input" placeholder="继续提问，或输入“记住：…”" rows="2">'+esc(s.chatDraft)+'</textarea><div class="row between"><span class="footnote">仅演示界面流程，不调用模型。</span>'+B('chat-send','发送（演示）','primary','','arrow')+'</div></div>'+(s.drawer?drawer():'');}
 function drawer(){const pending=['m7','m6'].filter(id=>find(id));return '<aside class="drawer" aria-label="本轮记忆"><div class="drawer-head"><span class="intro-symbol">'+icon('memory')+'</span><div class="grow"><h2>本轮记忆</h2><p>第 1 轮引用快照 · 来源可查，使用可控。</p></div>'+B('chat-close',icon('close'),'square ghost','aria-label="关闭本轮记忆"')+'</div><div class="drawer-tabs"><nav class="primary-tabs" aria-label="本轮记忆分类">'+B('drawer-tab','已引用 <span class="counter">'+(['denied','traceUnavailable'].includes(s.demoState)?'—':s.used.length)+'</span>','tab '+(s.drawerTab==='used'?'active':''),'data-tab="used"')+B('drawer-tab','相关候选 <span class="counter">'+pending.length+'</span>','tab '+(s.drawerTab==='related'?'active':''),'data-tab="related"')+'</nav></div><div class="drawer-content">'+offline()+(stateScreen()||(s.drawerTab==='used'?'<div class="soft-note blue" style="margin-bottom:15px">'+icon('link')+'<span>已注入的本轮快照不会被改写。排除只对下一轮起效。</span></div>':'<div class="soft-note" style="margin-bottom:15px">'+icon('search')+'<span>候选不代表本轮已用，也不代表事实成立。</span></div>')+(s.drawerTab==='used'?s.used:pending).map(id=>{const m=s.drawerTab==='used'?(s.usedSnapshot.find(x=>x.id===id)||find(id)):find(id);if(!m)return '';const excluded=s.excluded.includes(id)||find(id)?.status==='retired';return '<article class="memory-card '+(excluded?'excluded':'')+'"><div class="row between">'+badge(m.type,'blue')+(excluded?badge('下轮不再引用','','archive'):statusTag(m))+'</div><h3>'+esc(m.title)+'</h3><p class="footnote">'+esc(m.source)+' · '+esc(m.scope)+'</p><div class="card-actions">'+B('evidence','查看依据','link','data-id="'+id+'" '+(s.drawerTab==='used'?'data-snapshot="true"':''),'file')+(s.drawerTab==='used'?B('exclude',excluded?'恢复下轮使用':'下轮不用','ghost','data-id="'+id+'" '+disabled(),excluded?'refresh':'archive'):m.status==='confirmed'?B('pin',s.pinned.includes(id)?'已固定到下轮':'下轮固定引用','ghost','data-id="'+id+'" '+disabled(),'plus'):B('to-review','去核对','ghost','', 'alert'))+'</div>'+B('why',(s.why===id?'收起原因':'为什么'+(s.drawerTab==='used'?'引用':'推荐')),'link','data-id="'+id+'"')+(s.why===id?'<div class="why">'+esc(m.why)+'</div>':'')+'</article>';}).join(''))+'</div><div class="drawer-notice"><div class="row between"><span>本会话暂不调用记忆</span><button class="switch" role="switch" type="button" aria-label="本会话暂不调用记忆" aria-checked="'+s.recallPaused+'" data-action="pause-recall" '+disabled()+'></button></div><p style="margin-top:5px">下轮候选 '+nextUsed().length+' 条；不删除记忆，也不清除已有上下文。</p></div><footer class="drawer-footer">'+B('add','记住一条','',disabled(),'plus')+B('workbench','管理全部记忆','primary','data-view="memories"','external')+'</footer></aside>';}
 function render(){const focus=document.activeElement?.id;const oldChat=document.querySelector(".chat-scroll");if(oldChat)s.chatScroll=oldChat.scrollTop;document.documentElement.dataset.theme=s.theme;document.body.toggleAttribute('data-ds-dark-theme',s.theme==='dark');document.getElementById('app').innerHTML=demoBar()+'<div class="app-shell">'+sidebar()+'<div class="content-shell">'+header()+(s.surface==='settings'?settings():s.surface==='chat'?chat():workspace())+(s.evidence?O.evidencePanel():'')+'</div></div>';document.getElementById('toast-root').innerHTML=s.toast?'<div class="toast" role="status">'+icon('check')+'<span>'+esc(s.toast)+'</span>'+(s.undo?B('undo','撤销'):'')+B('dismiss-toast',icon('close'),'','aria-label="关闭提示"')+'</div>':'';if(focus)document.getElementById(focus)?.focus({preventScroll:true});const newChat=document.querySelector(".chat-scroll");if(newChat)newChat.scrollTop=s.chatScroll;O.renderModal?.();}
 Object.assign(O,{B,render,countReview,disabled,settingSwitch,memoryPage,stateScreen,offline});
})();

<script>
/* Graph, evidence, review, and expert controls. All paths refer to synthetic fixtures. */
(() => {
 const O=window.OC,{s,esc,icon,badge,statusTag,canWrite,find,B,countReview}=O;
 const dates=['09-10','09-14','09-18','09-20'];
 function graphData(){const historical=s.time<3, old=s.time===0, mid=s.time===1;
 const nodes=[{id:'project',x:25,y:30,title:'Atlas 文档服务',type:'项目',sub:'范围边界 · 演示'},{id:'req',x:300,y:30,title:'DEMO-042',type:'需求',sub:'工作区重置'},{id:'api',x:25,y:185,title:'工作区重置接口',type:'接口',sub:'不是需求的别名'},{id:'rule',x:300,y:185,title:old?'先保存临时副本':mid?'不保留副本（示例）':'用户二次确认',type:old?'历史约束':'约束',sub:old?'旧方案 v1':mid?'正式纪要 v2':'必须明确确认',historical:old},{id:'source',x:575,y:185,title:old?'示例方案 v1':mid?'示例评审纪要':'示例需求说明',type:'证据',sub:old?'SRC-03':mid?'SRC-04':'SRC-01 · §4.2'}];
 const edges=[{id:'p-r',from:'project',to:'req',label:'包含需求',d:'M205 62 H300',lx:252,ly:51},{id:'r-a',from:'req',to:'api',label:'对应接口',d:'M340 94 C340 141 115 132 115 185',lx:196,ly:135},{id:'r-c',from:'req',to:'rule',label:'具有约束',d:'M390 94 V185',lx:390,ly:141},{id:'c-s',from:'rule',to:'source',label:'依据',d:'M480 217 H575',lx:528,ly:206}];
 if(s.depth===2){nodes.push({id:'person',x:575,y:30,title:'示例负责人',type:'人员',sub:'经办不等于授权'});edges.push({id:'r-u',from:'req',to:'person',label:'经办人',d:'M480 62 H575',lx:528,ly:51});if(s.time>=2){nodes.push({id:'test',x:300,y:340,title:'恢复后对话验收',type:'验收要求',sub:'没有通过记录'});edges.push({id:'c-t',from:'rule',to:'test',label:'关联验收',d:'M390 249 V340',lx:390,ly:294});}if(s.inferred){nodes.push({id:'candidate',x:25,y:340,title:'索引器',type:'候选关系',sub:'只有共现，未证实依赖',inferred:true});edges.push({id:'a-i',from:'api',to:'candidate',label:'可能依赖 · 待核对',d:'M115 249 V340',lx:115,ly:294,inferred:true});}}
 return {nodes,edges,historical};}
 function graphSvg(){const {nodes,edges}=graphData();const w=800/s.zoom,h=440/s.zoom;return '<svg id="knowledge-graph" viewBox="'+((800-w)/2)+' '+((440-h)/2)+' '+w+' '+h+'" role="group" aria-label="Atlas 示例项目本体关系图"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#9dadc9"></path></marker></defs>'+edges.map(e=>'<g class="graph-edge '+(e.inferred?'inferred ':'')+((s.selectedEdge===e.id||s.question&&['r-c','c-s'].includes(e.id))?'selected':'')+'" data-action="graph-edge" data-id="'+e.id+'" role="button" tabindex="0" aria-label="查看关系：'+e.label+'"><path d="'+e.d+'" fill="none" stroke="transparent" stroke-width="20"></path><path class="edge-line" d="'+e.d+'" marker-end="url(#arrowhead)"></path><rect class="label-bg" x="'+(e.lx-(e.inferred?53:29))+'" y="'+(e.ly-8)+'" width="'+(e.inferred?106:58)+'" height="19" rx="5"></rect><text class="edge-label" x="'+e.lx+'" y="'+(e.ly+5)+'" text-anchor="middle">'+e.label+'</text></g>').join('')+nodes.map(n=>'<g class="graph-node '+(s.graphSelected===n.id?'selected ':'')+(n.historical?'historical ':'')+(n.inferred?'inferred':'')+'" data-action="graph-node" data-id="'+n.id+'" tabindex="0" role="button" aria-label="查看对象：'+n.title+'" transform="translate('+n.x+','+n.y+')"><rect class="node-bg" width="180" height="64" rx="11"></rect><circle class="node-dot" cx="14" cy="14" r="3"></circle><text class="node-type" x="24" y="18">'+n.type+'</text><text class="node-label" x="13" y="38">'+n.title+'</text><text class="node-sub" x="13" y="54">'+n.sub+'</text></g>').join('')+'</svg>';}
 function graphDetail(){const {nodes,edges}=graphData(),n=nodes.find(n=>n.id===s.graphSelected)||nodes[1],e=edges.find(e=>e.id===s.selectedEdge);const dc=find(s.time===0?'m4':s.time===1?'m5':'m1');const refs={'p-r':{quote:'Atlas 示例项目包含 DEMO-042 工作区重置需求。',source:'示例对象身份清单',id:'entity:project'},project:{quote:'这是虚构的 Atlas 文档服务项目；范围不跨越其他项目。',source:'示例对象身份清单',id:'entity:project'},'r-a':{quote:'工作区重置接口与 DEMO-042 需求相关，但类型不同，不能作为同一实体合并。',source:'示例对象身份清单',id:'entity:api'},api:{quote:'接口是技术对象；需求是工作对象。两者通过对应关系相连。',source:'示例对象身份清单',id:'entity:api'},'r-u':{quote:'示例负责人经办 DEMO-042；经办关系不构成操作授权。',source:'示例对象身份清单',id:'entity:person'},person:{quote:'这是虚构的经办人员身份；不据此推导任何访问权限。',source:'示例对象身份清单',id:'entity:person'},'c-t':{quote:find('m3').text,source:find('m3').source,id:'m3'},test:{quote:find('m3').text,source:find('m3').source,id:'m3'},'a-i':{quote:find('m6').text,source:'无直接证据',id:'m6',pending:true},candidate:{quote:find('m6').text,source:'无直接证据',id:'m6',pending:true}};const info=refs[e?.id||n.id]||{quote:dc.text,source:dc.source,id:dc.id};const pathEdge=e||edges.find(x=>x.id===({project:'p-r',req:'r-c',api:'r-a',rule:'r-c',source:'c-s',person:'r-u',test:'c-t',candidate:'a-i'}[n.id]));const text=e?e.label:n.title;return '<aside class="panel detail-card" aria-label="图谱对象与关系详情"><div><div class="row between"><span class="section-label">'+(e?'关系详情':'对象档案')+'</span>'+badge(info.pending?'待确认':'可追溯',info.pending?'amber':'blue')+'</div><h3>'+text+'</h3><p class="footnote">'+(e?'每条关系都有含义、范围与证据。':n.sub)+'</p><div class="section-label">'+(e?'关系路径':'关联路径')+'</div><div class="mini-path"><b>'+ (nodes.find(x=>x.id===pathEdge?.from)?.title||n.title)+'</b><span>→</span><b>'+(nodes.find(x=>x.id===pathEdge?.to)?.title||'未记录关联')+'</b></div></div><div><div class="section-label">'+(info.pending?'证据缺口':'证据片段')+'</div><div class="evidence-excerpt '+(info.pending?'amber':'')+'">'+esc(info.quote)+'</div><div class="source-caption">'+icon('file')+esc(info.source)+'</div><dl class="key-values" style="margin-top:18px"><dt>范围</dt><dd>Atlas 示例项目</dd><dt>查看时点</dt><dd>2026-'+dates[s.time]+'</dd><dt>判断边界</dt><dd>要求不等于已实现</dd></dl>'+B('evidence','展开完整依据','link','data-id="'+info.id+'"','external')+'</div></aside>';}
 function graphPage(){const g=graphData();return (s.demoState==='truncated'?'<div class="offline-banner"><span>图谱展示已截断（演示）：只显示当前子图，不将局部结果当成完整关系。</span>'+B('restore','缩小范围并重试')+'</div>':'')+'<div class="sub-toolbar"><div><h2>关系图谱</h2><p class="footnote" style="margin-top:4px">按对象展开，而不是一次展示整张大网。</p></div><div class="segmented">'+B('graph-mode','关系图',s.graphMode==='graph'?'active':'','data-mode="graph"','graph')+B('graph-mode','关系列表',s.graphMode==='list'?'active':'','data-mode="list"','list')+'</div></div><div class="graph-query"><input id="graph-question" aria-label="向图谱提问" placeholder="试问：为什么需要二次确认？" value="'+(s.question?'为什么需要二次确认？':'')+'">'+B('graph-question','查看解释路径','primary','','search')+B('graph-clear','清除高亮','ghost')+'</div>'+(s.time<3?'<div class="history-banner"><span>'+icon('clock')+' 正在回看 2026-'+dates[s.time]+' 的示例状态 · 历史只读</span>'+B('time-current','回到当前')+'</div>':'')+(s.question?'<div class="soft-note blue" style="margin-bottom:14px">'+icon('link')+'<span>解释路径：需求 → 明确确认约束 → 原始依据。这里只说明要求来源，不证明已实现。</span></div>':'')+'<div class="graph-split"><section class="panel graph-panel"><div class="graph-toolbar"><div class="segmented">'+B('depth','一层',s.depth===1?'active':'','data-depth="1"')+B('depth','两层',s.depth===2?'active':'','data-depth="2"')+'</div><label class="row small" style="gap:5px"><input type="checkbox" id="show-inferred" '+(s.inferred?'checked':'')+' style="min-height:16px">显示待确认关系</label><div class="row" style="gap:3px">'+B('zoom-out','−','', 'aria-label="缩小图谱"')+B('zoom-in','+','', 'aria-label="放大图谱"')+B('zoom-reset',icon('expand'),'','aria-label="适配图谱"')+'</div></div>'+(s.graphMode==='graph'?'<div class="graph-stage">'+graphSvg()+'<div class="graph-legend"><span><i></i>有来源关系</span><span><i class="dashed"></i>待确认，不用于推理</span></div></div>':'<div style="padding:16px">'+g.edges.map(e=>'<div class="relation-row"><b>'+g.nodes.find(n=>n.id===e.from)?.title+'</b><span>'+e.label+' →</span><b>'+g.nodes.find(n=>n.id===e.to)?.title+'</b>'+B('graph-edge','查看依据','link','data-id="'+e.id+'"')+'</div>').join('')+'</div>')+'<div class="graph-info">'+g.nodes.length+' 个可见对象 · '+g.edges.length+' 条关系 · 点击对象或连线查看详情'+(s.time<3?' · 历史视图':'')+'</div><div class="timeline-strip"><div class="row between small"><span>'+icon('clock')+' 信息生效时间</span><span class="muted">4 个演示时间点 · '+(s.time===3?'当前':'历史只读')+'</span></div><input id="graph-time" type="range" aria-label="图谱历史时间点" min="0" max="3" step="1" value="'+s.time+'"><div class="timeline-labels"><span>09-10 旧方案</span><span>09-14 评审</span><span>09-18 约束</span><span>09-20 当前</span></div></div></section>'+graphDetail()+'</div>';}
 function reviewPage(){return '<div class="sub-toolbar"><div><h2>待确认事项</h2><p class="footnote" style="margin-top:4px">不按时间自动覆盖，不把同名对象直接合并。</p></div>'+badge(countReview()+' 项待确认',countReview()?'amber':'green')+'</div><div class="review-layout"><nav class="review-queue" aria-label="待确认队列">'+B('review-select',badge(s.resolved?'已处理':'内容冲突',s.resolved?'green':'red')+'<b>备份策略不一致</b><p>正式纪要与后续草稿存在范围重叠。</p>','queue-card '+(s.review==='conflict'?'active':''),'data-review="conflict"')+B('review-select',badge(s.merged?'已处理':'名称待对齐',s.merged?'green':'amber')+'<b>两个名称是同一需求吗？</b><p>仅同类型候选；接口保持独立。</p>','queue-card '+(s.review==='merge'?'active':''),'data-review="merge"')+'</nav><section class="panel review-detail">'+(s.review==='conflict'?conflictDetail():mergeDetail())+'</section></div>'+(s.history.length?'<section class="panel panel-pad" style="margin-top:18px"><h3>本次演示操作记录</h3>'+s.history.map(h=>'<div class="audit-item"><span class="audit-dot"></span><div><b>'+esc(h.title)+'</b><p class="footnote">'+esc(h.text)+'</p></div></div>').join('')+'</section>':'');}
 function conflictDetail(){if(s.resolved)return '<div class="state-screen" style="min-height:330px"><span class="intro-symbol">'+icon('check')+'</span><h2>冲突已处理（演示）</h2><p>处理结果已同步到记忆、图谱和后续召回候选。第 1 轮引用快照保持不变。</p>'+B('view','到记忆中查看','primary','data-view="memories"')+B('undo','撤销这次演示处理','ghost',s.undo?'':'disabled')+'</div>';return '<div class="row between"><h2>重置前是否保留副本？</h2>'+badge('同对象 · 范围待核对','amber')+'</div><p class="footnote" style="margin-top:8px">两条记录都已保存，但这并不意味着它们都成立。</p><div class="comparison"><section><div class="row between">'+badge('记录 A','blue')+'<span class="small muted">09-14</span></div><h3 style="margin-top:12px">正式评审纪要</h3><p>示例生产环境重置时，不保留工作区副本。</p><div class="badge-row">'+badge('正式纪要')+badge('当前有争议','red')+'</div>'+B('evidence','查看原文','link','data-id="m5"','file')+'</section><section><div class="row between">'+badge('记录 B','amber')+'<span class="small muted">09-19</span></div><h3 style="margin-top:12px">后续讨论草稿</h3><p>重置前仍需保存副本，但未说明适用环境。</p><div class="badge-row">'+badge('未批准草稿')+badge('范围待核对','amber')+'</div>'+B('evidence','查看原文','link','data-id="m8"','file')+'</section></div><div class="soft-note amber">'+icon('alert')+'<span>较新的记录不会自动覆盖旧决策。请核对来源权限、适用环境和生效时间。</span></div><div class="review-actions">'+B('resolve','以正式纪要为当前依据','primary',O.disabled())+B('split-scope','两条适用于不同环境','',O.disabled())+B('review-later','暂不处理','ghost')+'</div><p class="footnote" style="margin-top:14px">保存前会展示影响范围，并要求说明处理理由。原始证据保留。</p>';}
 function mergeDetail(){return s.merged?'<div class="state-screen"><span class="intro-symbol">'+icon('check')+'</span><h2>别名已对齐（演示）</h2><p>同一需求共享规范 ID。接口对象仍然独立，通过关系连接。</p>'+B('entity','查看需求档案','primary','data-id="req"')+'</div>':'<h2>这是同一个需求的两种叫法吗？</h2><p class="footnote" style="margin-top:8px">只因名字相似不能自动合并，先核对类型、外部 ID 和证据。</p><div class="comparison"><section>'+badge('需求','blue')+'<h3 style="margin-top:12px">DEMO-042</h3><p>规范外部编号一致。已关联明确确认等约束。</p></section><section>'+badge('需求候选','amber')+'<h3 style="margin-top:12px">工作区重置需求</h3><p>示例来源给出相同编号；可作为别名候选。</p></section></div><div class="soft-note">'+icon('shield')+'<span>“工作区重置接口”是接口类型，不在此合并范围内；合并不扩大访问权限。</span></div><div class="review-actions">'+B('merge-preview','预览合并影响','primary',O.disabled())+B('review-later','暂不合并','ghost')+'</div>';}
 function advancedPage(){return '<div class="settings-tabs segmented">'+B('advanced-tab','基础与隐私',!s.advanced?'active':'','data-mode="basic"')+B('advanced-tab','类型与关系',s.advanced?'active':'','data-mode="advanced"')+'</div>'+(s.advanced?schemaPage():'<section class="panel panel-pad"><h2>使用策略</h2><p class="footnote" style="margin:7px 0 23px">捕获、长期保存和回答召回分别控制，默认使用最少必要信息。</p>'+O.settingSwitch('capture','自动记忆','关闭仅停止新的自动捕获，不删除已保存资料。',true)+O.settingSwitch('recall','回答时使用记忆','关闭仅停止后续注入，已有会话上下文不被清除。')+O.settingSwitch('ontology','关联理解','启用受控类型与关系；候选推断默认不进入回答。')+'<div class="settings-row"><div><h3>默认范围</h3><p>原型仅提供个人 / Atlas 示例项目；不进行跨项目共享。</p></div>'+badge('按来源权限过滤','green','shield')+'</div><div class="settings-row"><div><h3>敏感信息与凭据</h3><p>密钥不入记忆；模型和网关凭据仍使用 DSH 原有管理。</p></div>'+badge('由 DSH 管理','','lock')+'</div><div class="row wrap">'+B('config-save','保存设置','primary',O.disabled()+' '+(!O.dirty()?'disabled':''))+B('privacy-info','停止召回与删除的区别','link','','file')+'</div></section><div class="soft-note" style="margin-top:17px">'+icon('clock')+'<span>永久删除必须单独授权并回报清理进度；“停止召回”不等于删除原文、会话记录或备份。</span></div>');}
 function schemaPage(){return '<section class="panel panel-pad"><div class="row between"><div><span class="eyebrow">专家选项 · 日常使用无需配置</span><h2 style="margin-top:7px">类型、关系与规则</h2></div>'+badge('本体版本 1.0 · 演示','blue')+'</div><p class="footnote" style="margin-top:10px">不是自由标签：明确允许的关系方向与对象类型，错误不会被静默接受。</p><div class="schema-types">'+['项目 Project','需求 Requirement','接口 API','人员 Person','约束 Constraint','主张 Claim','证据 Evidence'].map(t=>badge(t,'blue')).join('')+'</div><div class="rule-row"><b>具有约束</b><span class="rule-arrow">Requirement → Constraint</span><span class="spacer"></span>'+badge('已定义','green','check')+'</div><div class="rule-row"><b>由证据支持</b><span class="rule-arrow">Claim → Evidence</span><span class="spacer"></span>'+badge('要求片段引用','green')+'</div><div class="rule-row"><b>替代旧主张</b><span class="rule-arrow">Claim → Claim</span><span class="spacer"></span>'+badge('必须校验范围与时间','amber')+'</div><div style="margin-top:25px"><h3>试一条类型校验</h3><p class="footnote" style="margin-top:6px">把主语切成“人员”，再校验，就能看到明确的错误位置。</p><div class="rule-row"><select id="schema-subject" aria-label="校验主语类型" '+O.disabled()+'><option value="Requirement" '+(s.schemaSubject==='Requirement'?'selected':'')+'>需求 Requirement</option><option value="Person" '+(s.schemaSubject==='Person'?'selected':'')+'>人员 Person</option></select><span>具有约束 →</span>'+badge('约束 Constraint','blue')+B('schema-check','校验示例','primary',O.disabled())+'</div>'+(s.schemaResult!==null?'<div class="validation-result '+(s.schemaResult?'':'bad')+'" role="status">'+(s.schemaResult?'通过：主语 Requirement、关系 has_constraint、宾语 Constraint 符合类型定义。':'拒绝：has_constraint 的主语必须是 Requirement；当前是 Person。没有写入任何关系。')+'</div>':'')+'</div></section><section class="panel panel-pad" style="margin-top:16px"><div class="row between"><div><h3>受控规则，而不是自动执行器</h3><p class="footnote" style="margin-top:5px">只允许有界派生；不调用工具、不推导权限、不用共现证明因果。</p></div>'+badge('默认一层 · 最多两层')+'</div><div class="soft-note" style="margin-top:15px">'+icon('shield')+'<span>类型继承、基数约束、双时态、规则试跑与版本迁移在完整方案中定义；本原型只实际演示上述 domain/range 校验。</span></div><div class="row wrap" style="margin-top:13px">'+B('schema-preview','预览规则发布流程','',O.disabled(),'eye')+B('workbench','回到图谱','link','data-view="graph"','graph')+'</div></section>';}
 function evidencePanel(){const entity=s.evidence.startsWith('entity:')?s.entities.find(e=>e.id===s.evidence.split(':')[1]):null,m=s.evidenceSnapshot||(entity?{id:'entity:'+entity.id,title:entity.name,type:entity.type,status:'confirmed',scope:'Atlas 项目',source:'示例对象身份清单',text:entity.desc+'。此处是演示身份资料，不把其他记忆的证据当作该对象的身份证明。',evidence:'FIXTURE-'+entity.id,validFrom:'2026-09-20',date:'09-20'}:find(s.evidence));if(!m)return '';return '<div class="overlay-panel" data-action="evidence-backdrop"><aside class="evidence-drawer" aria-label="依据与对象详情" role="dialog" aria-modal="true"><div class="drawer-head"><div class="grow"><span class="section-label">'+(entity?'对象档案':'依据与关系')+'</span><h2 style="margin-top:7px">'+esc(entity?entity.name:m.title)+'</h2></div>'+B('evidence-close',icon('close'),'square ghost','aria-label="关闭依据面板"')+'</div><div style="padding:0 26px"><div class="badge-row" style="margin-bottom:13px">'+(entity?badge(entity.type,'blue')+badge('规范实体'):badge(m.type,'blue')+statusTag(m))+'</div><nav class="primary-tabs" aria-label="详情分类">'+[['source','依据'],['relations','关系'],['history','版本']].map(([v,t])=>B('evidence-tab',t,'tab '+(s.evidenceTab===v?'active':''),'data-tab="'+v+'"')).join('')+'</nav></div><div class="drawer-content">'+(entity?'<dl class="key-values"><dt>规范身份</dt><dd>'+esc(entity.name)+'</dd><dt>别名</dt><dd>'+esc(entity.aliases.join('、')||'暂无')+'</dd><dt>类型</dt><dd>'+esc(entity.type)+'</dd><dt>身份边界</dt><dd>'+esc(entity.desc)+'</dd></dl><hr class="divider" style="margin:20px 0">':'')+(s.evidenceTab==='source'?'<div class="row between"><h3>原始依据</h3>'+badge(m.evidence?'可追溯片段':'无直接依据',m.evidence?'green':'amber')+'</div><div class="quote-block">'+esc(m.text)+'</div><div class="source-caption">'+icon('file')+esc(m.source)+'</div><dl class="key-values" style="margin-top:24px"><dt>保存状态</dt><dd>'+(m.status==='retired'?'已停止召回，原文仍保留':'已保存于演示数据')+'</dd><dt>依据状态</dt><dd>'+(m.status==='pending'?'推断，未核对':m.status==='disputed'?'存在相反陈述':'来源已核对，不等于客观真或已完成')+'</dd><dt>本轮使用</dt><dd>'+(s.used.includes(m.id)?'第 1 轮已引用；快照固定':'未被第 1 轮引用')+'</dd><dt>适用范围</dt><dd>'+esc(m.scope)+'</dd><dt>生效时间</dt><dd>'+m.validFrom+(m.validTo?' 至 '+m.validTo:' 起')+'</dd><dt>记录时间</dt><dd>2026-'+m.date+'（演示）</dd><dt>证据编号</dt><dd>'+esc(m.evidence||'尚无')+'</dd></dl><details style="margin-top:20px"><summary>为什么保留这个区别？</summary><p class="footnote">来源核对、用户确认、已保存和本轮引用各有含义。反复引用同一来源不会增加独立证据，也不会证明需求已经实现。</p></details>':s.evidenceTab==='relations'?'<h3>可解释的关联</h3><div class="relation-row"><b>DEMO-042</b><span>具有约束 →</span><b>用户二次确认</b></div><div class="relation-row"><b>约束主张</b><span>由证据支持 →</span><b>SRC-01 §4.2</b></div><div class="relation-row"><b>DEMO-042</b><span>对应接口 →</span><b>工作区重置接口</b></div><p class="footnote" style="margin-top:18px">需求与接口是独立实体。上述关联均为演示，不反映真实业务。</p>'+B('evidence-to-graph','在图谱中查看','primary','style="margin-top:17px"','graph'):'<h3>记忆修订与来源版本</h3><div class="version-row"><span class="version-date">'+m.date+'</span><div><b>当前记录 · v'+s.revision+'</b><p class="footnote">'+esc(m.source)+'</p></div></div><div class="version-row"><span class="version-date">来源</span><div><b>'+esc(m.evidence||'待核对')+'</b><p class="footnote">原始内容不可被派生摘要覆盖。</p></div></div>'+s.history.map(h=>'<div class="version-row"><span class="version-date">本次演示</span><div>'+esc(h.title)+'<p class="footnote">'+esc(h.text)+'</p></div></div>').join('')+'<div class="soft-note" style="margin-top:20px">'+icon('clock')+'<span>完整实现将支持“当时所知”与“最新所知的过去”两种查询。本原型不模拟完整双时态数据库。</span></div>')+'</div><footer class="drawer-footer">'+(entity?'':B('edit','修订','', 'data-id="'+m.id+'" '+O.disabled(),'edit')+B('retire','停止召回','', 'data-id="'+m.id+'" '+O.disabled()+' '+(m.status==='retired'?'disabled':''),'archive'))+B('evidence-to-graph','查看图谱','primary','','graph')+'</footer></aside></div>';}
 Object.assign(O,{graphPage,graphData,reviewPage,advancedPage,evidencePanel});
})();

<script>
/* Local state transitions only. Network, persistence, authentication, and inference engines are intentionally absent. */
(() => {
 const O=window.OC,{s,esc,icon,badge,B,find,canWrite}=O;
 let modalReturn=null,evidenceReturn=null,busy=false;
 function notify(t,keepUndo=false){s.toast=t;if(!keepUndo)s.undo=null;}
 function closeModal(){document.getElementById('oc-modal')?.close();s.modal=null;s.modalError='';busy=false;document.getElementById('modal-root').innerHTML='';if(modalReturn?.isConnected)modalReturn.focus({preventScroll:true});}
 function openModal(type,data={}){modalReturn=document.activeElement;s.modal={type,...data};s.modalError='';O.renderModal();}
 function openEvidence(id,snapshot=false){evidenceReturn=document.activeElement;s.evidence=id;s.evidenceSnapshot=snapshot?s.usedSnapshot.find(m=>m.id===id):null;s.evidenceTab='source';O.render();document.querySelector('[data-action="evidence-close"]')?.focus({preventScroll:true});}
 function closeEvidence(){s.evidence=null;s.evidenceSnapshot=null;O.render();if(evidenceReturn){const action=evidenceReturn.dataset?.action,id=evidenceReturn.dataset?.id;const q=action?'[data-action="'+action+'"]'+(id?'[data-id="'+id+'"]':''):'';document.querySelector(q||'#memory-trigger')?.focus({preventScroll:true});}}
 function navigate(dest){if(O.dirty()){openModal('navigate',{dest});return;}applyNavigation(dest);}
 function applyNavigation(dest){s.evidence=null;s.evidenceSnapshot=null;if(dest==='chat'){s.surface='chat';s.drawer=false;}else if(dest==='settings'){s.surface='settings';}else if(dest==='back'){s.surface=s.returnFrom==='chat'?'chat':'settings';s.drawer=s.returnFrom==='chat';}else{if(s.surface!=='workspace')s.returnFrom=s.surface==='chat'?'chat':'settings';s.surface='workspace';s.view=dest==='workbench-settings'?'settings':dest;s.drawer=false;}O.render();}
 function showError(text){s.modalError=text;const el=document.getElementById('modal-error');if(el)el.textContent=text;document.getElementById('modal-submit')?.removeAttribute('disabled');busy=false;}
 const field=(id,title,content,hint='')=>'<div class="field"><label for="'+id+'">'+title+'</label>'+content+(hint?'<p>'+hint+'</p>':'')+'</div>';
 const reasonField=()=>field('change-reason','处理理由（必填）','<textarea id="change-reason" placeholder="说明依据与适用范围，不要填写敏感信息。" rows="2">'+esc(s.modal?.reason||'')+'</textarea>');
 function renderModal(){const m=s.modal,root=document.getElementById('modal-root');if(!m){root.innerHTML='';return;}const title={add:'记住一条重要信息',edit:'修订记忆',retire:'停止后续召回？',resolve:'确认这次冲突处理',split:'区分适用环境',merge:'合并影响预览',schema:'规则发布预览',privacy:'停止召回，不等于删除',navigate:'有尚未保存的设置'}[m.type]||'确认';let body='',submit='确认（仅演示）';

 if(m.type==='navigate'){body='<p>继续会放弃本次尚未保存的开关变化；已保存设置和真实插件不受影响。</p>';submit='放弃更改并继续';}
 root.innerHTML='<dialog id="oc-modal" aria-labelledby="modal-title"><header class="modal-head"><h2 id="modal-title">'+title+'</h2>'+B('modal-cancel',icon('close'),'square ghost','aria-label="关闭弹窗"')+'</header><div class="modal-body">'+body+'<div id="modal-error" class="inline-error" role="alert">'+esc(s.modalError)+'</div></div><footer class="modal-footer">'+B('modal-cancel','取消')+B('modal-submit',submit,'primary','id="modal-submit" '+(!canWrite()&&!['privacy','navigate','schema'].includes(m.type)?'disabled':''))+'</footer></dialog>';const d=document.getElementById('oc-modal');d.showModal();d.addEventListener('cancel',e=>{e.preventDefault();closeModal();});const focus=d.querySelector('textarea,input,select');if(focus)focus.focus({preventScroll:true});}
 async function submitModal(){if(busy||!s.modal)return;const m=s.modal;if(['privacy','schema'].includes(m.type)){closeModal();return;}if(m.type==='navigate'){s.draft={...s.config};const dest=m.dest;closeModal();applyNavigation(dest);return;}if(!canWrite()){showError('当前状态只允许查看，未保存任何修改。');return;}const content=document.getElementById('memory-content')?.value.trim(),reason=document.getElementById('change-reason')?.value.trim();if(['add','edit'].includes(m.type)&&!content){showError('请填写记忆内容，空内容不能保存。');return;}if(['edit','retire','resolve','split','merge'].includes(m.type)&&!reason){showError('请填写处理理由，便于追溯这次更改。');return;}if(m.type==='split'&&document.getElementById('scope-a').value===document.getElementById('scope-b').value){showError('两个环境相同，冲突仍未消除；请核对范围或取消。');return;}if(s.demoState==='stale'){showError('演示并发冲突：记录版本已经更新。你的草稿已保留；切换为“正常”后重新核对再保存。');return;}busy=true;document.getElementById('modal-submit').disabled=true;document.getElementById('modal-submit').textContent='保存中…';const scope=document.getElementById('save-scope')?.value,a=document.getElementById('scope-a')?.value,b=document.getElementById('scope-b')?.value;await new Promise(r=>setTimeout(r,280));if(!s.modal||s.modal!==m)return;if(!canWrite()){showError('状态已变化，写入取消。草稿保留，未发生部分保存。');return;}O.checkpoint();let text='演示状态已更新';
 if(m.type==='add'){const duplicate=s.memory.find(x=>x.text===content&&x.scope===scope);if(duplicate){closeModal();notify('已存在相同内容与范围，未重复保存。');O.render();return;}const id='demo-user-'+(s.memory.length+1);s.memory.unshift({id,title:content.length>46?content.slice(0,46)+'…':content,text:content,type:'用户陈述',entity:'手动记录',scope,status:'confirmed',source:'本次演示中的明确保存',date:'09-20',evidence:'DEMO-USER-STATEMENT',validFrom:'2026-09-20',basis:'用户陈述，不保证为真',why:'用户明确保存；仍需按范围与证据审慎使用。'});s.demoState='ready';text='已保存到'+scope+'（仅演示），两个入口同步可见。';}
 if(m.type==='edit'){const old=find(m.id);s.history.unshift({title:'修订：'+old.title,text:'保留上一版本与原始依据；理由：'+reason});old.previousRevision={text:old.text,source:old.source,evidence:old.evidence};old.source='本次演示中的用户修订';old.evidence='DEMO-USER-REVISION-'+(s.revision+1);old.basis='用户修订，需核对';old.text=content;old.title=content.length>46?content.slice(0,46)+'…':content;old.scope=scope;old.date='09-20';text='修订已保存（演示）；本轮引用快照保持原样。';}
 if(m.type==='retire'){find(m.id).status='retired';s.history.unshift({title:'停止召回：'+find(m.id).title,text:'原文和已发送对话保留；理由：'+reason});text='已停止后续召回（演示），没有删除原始资料。';}
 if(m.type==='resolve'){s.resolved=true;find('m5').status='confirmed';find('m8').status='historical';find('m8').validTo='2026-09-20';find('m5').basis='人工核对正式纪要';s.history.unshift({title:'冲突处理：采用正式纪要作为当前依据',text:'未覆盖原文；理由：'+reason});text='冲突处理已同步（演示），历史证据保留。';}
 if(m.type==='split'){s.resolved=true;find('m5').status='confirmed';find('m8').status='confirmed';find('m5').environment=a;find('m8').environment=b;find('m5').basis='适用于'+a;find('m8').basis='适用于'+b;s.history.unshift({title:'区分适用范围：'+a+' / '+b,text:'两条保留，按环境分别检索；理由：'+reason});text='适用环境已区分（演示），没有删除任一来源。';}
 if(m.type==='merge'){s.merged=true;const req=s.entities.find(e=>e.id==='req');if(!req.aliases.includes('工作区重置需求'))req.aliases.push('工作区重置需求');s.history.unshift({title:'对齐需求别名：工作区重置需求 → DEMO-042',text:'接口未合并，权限不扩大；理由：'+reason});text='别名已对齐（演示），需求和接口仍是不同实体。';}
 s.revision++;closeModal();notify(text,true);O.render();}
 const writeActions=new Set(['config-toggle','config-save','add','edit','retire','resolve','split-scope','merge-preview','exclude','pin','pause-recall','schema-check']);
 function act(a,el){if(el?.disabled)return;if(writeActions.has(a)&&!canWrite()){notify('当前只读，未写入任何数据。');O.render();return;}switch(a){
 case 'surface-chat':navigate('chat');break;case 'surface-settings':navigate('settings');break;
 case 'workbench':if(el?.dataset.advanced==='true')s.advanced=true;navigate(el?.dataset.view==='settings'?'workbench-settings':(el?.dataset.view||'memories'));break;
 case 'workspace-back':navigate('back');break;case 'view':navigate(el.dataset.view==='settings'?'workbench-settings':el.dataset.view);break;
 case 'drawer-open':s.drawer=true;s.surface='chat';O.render();break;
 case 'chat-close':s.drawer=false;O.render();document.getElementById('memory-trigger')?.focus({preventScroll:true});break;
 case 'drawer-tab':s.drawerTab=el.dataset.tab;O.render();break;
 case 'theme':s.theme=s.theme==='light'?'dark':'light';O.render();break;
 case 'reset':closeModal();O.reset();O.render();break;
 case 'restore':s.demoState='ready';notify('已恢复正常演示状态。');O.render();break;
 case 'config-toggle':s.draft[el.dataset.key]=!s.draft[el.dataset.key];O.render();break;
 case 'config-cancel':s.draft={...s.config};O.render();break;
 case 'config-save':if(s.demoState==='stale'){notify('版本变化，保存已阻止；草稿保留。');O.render();return;}s.config={...s.draft};notify('设置已保存（仅演示），没有修改正式插件。');O.render();break;
 case 'subview':s.subview=el.dataset.subview;O.render();break;
 case 'search':s.query=document.getElementById('memory-query')?.value.trim()||'';O.render();break;
 case 'clear-filters':s.query='';s.scope='all';s.status='all';O.render();break;
 case 'evidence':openEvidence(el.dataset.id,el.dataset.snapshot==='true');break;
 case 'entity':openEvidence('entity:'+el.dataset.id);break;
 case 'evidence-close':closeEvidence();break;
 case 'evidence-backdrop':closeEvidence();break;
 case 'evidence-tab':s.evidenceTab=el.dataset.tab;O.render();break;
 case 'evidence-to-graph':s.evidence=null;s.evidenceSnapshot=null;navigate('graph');break;
 case 'evidence-current':openEvidence(el.dataset.id,false);break;
 case 'why':s.why=s.why===el.dataset.id?null:el.dataset.id;O.render();break;
 case 'exclude':{const id=el.dataset.id;if(find(id)?.status==='retired'){notify('该记忆已停止长期召回，需要先在管理工作台修订恢复。');O.render();break;}O.checkpoint();s.excluded=s.excluded.includes(id)?s.excluded.filter(x=>x!==id):[...s.excluded,id];notify(s.excluded.includes(id)?'下轮将排除此条；本轮引用快照和长期记忆都保留。':'已恢复下轮使用资格（演示）。',true);O.render();break;}
 case 'pin':{const id=el.dataset.id;if(find(id)?.status!=='confirmed'){notify('未核对或有争议的主张不能直接固定为事实。');O.render();break;}O.checkpoint();s.pinned=s.pinned.includes(id)?s.pinned.filter(x=>x!==id):[...s.pinned,id];notify('已更新下轮固定引用（演示），未重复保存记忆。',true);O.render();break;}
 case 'pause-recall':s.recallPaused=!s.recallPaused;notify(s.recallPaused?'本会话后续不注入记忆；不删除历史上下文。':'已恢复本会话后续记忆注入（演示）。');O.render();break;
 case 'add':openModal('add',{scope:'Atlas 项目',content:''});break;
 case 'edit':openModal('edit',{id:el.dataset.id,content:find(el.dataset.id)?.text,scope:find(el.dataset.id)?.scope});break;
 case 'retire':openModal('retire',{id:el.dataset.id});break;
 case 'resolve':openModal('resolve');break;case 'split-scope':openModal('split');break;case 'merge-preview':openModal('merge');break;
 case 'review-select':s.review=el.dataset.review;O.render();break;
 case 'to-review':navigate('review');notify('待确认的推断不会自动用于回答；请先补充直接证据。');O.render();break;
 case 'review-later':notify('保持待确认；没有更改任何当前结论。');O.render();break;
 case 'depth':s.depth=Number(el.dataset.depth);if(s.depth===1)s.inferred=false;s.selectedEdge=null;O.render();break;
 case 'graph-node':s.graphSelected=el.dataset.id;s.selectedEdge=null;O.render();break;
 case 'graph-edge':s.selectedEdge=el.dataset.id;O.render();break;
 case 'graph-mode':s.graphMode=el.dataset.mode;O.render();break;
 case 'graph-question':{const q=document.getElementById('graph-question').value.trim();if(q&&!/确认|为什么|依据|要求/.test(q)){notify('原型只演示“为什么需要二次确认”的固定路径，不调用大模型。');O.render();break;}s.question=true;s.selectedEdge='c-s';s.graphSelected='rule';s.time=3;O.render();break;}
 case 'graph-clear':s.question=false;s.selectedEdge=null;O.render();break;
 case 'zoom-in':s.zoom=Math.min(1.7,s.zoom+.15);O.render();break;
 case 'zoom-out':s.zoom=Math.max(.7,s.zoom-.15);O.render();break;
 case 'zoom-reset':s.zoom=1;O.render();break;
 case 'time-current':s.time=3;O.render();break;
 case 'advanced-tab':s.advanced=el.dataset.mode==='advanced';O.render();break;
 case 'schema-check':s.schemaResult=s.schemaSubject==='Requirement';O.render();break;
 case 'schema-preview':openModal('schema');break;
 case 'privacy-info':openModal('privacy');break;
 case 'modal-cancel':closeModal();break;case 'modal-submit':submitModal();break;
 case 'undo':if(s.undo){const snap=JSON.parse(s.undo);Object.assign(s,snap);s.undo=null;notify('已撤销最近一次演示更改；真实资料未受影响。');O.render();}break;
 case 'dismiss-toast':s.toast=null;O.render();break;
 case 'chat-send':{const t=document.getElementById('chat-input').value.trim();if(!t){notify('先输入一句话，再试试演示。');O.render();break;}if(/^记住[：:]/.test(t)){openModal('add',{scope:'Atlas 项目',content:t.replace(/^记住[：:]/,'').trim()});break;}s.chatDraft='';s.extraMessages.push({role:'user',text:t},{role:'assistant',text:'演示说明：下一轮将按你的选择使用 '+O.nextUsed().length+' 条记忆。正式实现会生成新轮次的引用记录；本页仍可核对第 1 轮的固定快照。这里没有调用真实模型。'});O.render();break;}
 default:console.warn('Unknown prototype action',a);

 document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='evidence-backdrop'&&e.target!==el)return;act(el.dataset.action,el);});
 document.addEventListener('change',e=>{const el=e.target;switch(el.id){case 'demo-state':s.demoState=el.value;s.evidence=null;s.evidenceSnapshot=null;if(s.modal){s.modal=null;document.getElementById('modal-root').innerHTML='';}break;case 'distill-model':s.draft.model=el.value;break;case 'memory-scope':s.scope=el.value;break;case 'memory-status':s.status=el.value;break;case 'show-inferred':s.inferred=el.checked;if(s.inferred)s.depth=2;break;case 'graph-time':s.time=Number(el.value);s.question=false;s.selectedEdge=null;break;case 'schema-subject':s.schemaSubject=el.value;s.schemaResult=null;break;default:return;}O.render();});
 document.addEventListener('input',e=>{if(e.target.id==='chat-input'){s.chatDraft=e.target.value;return;}if(!s.modal)return;const map={'memory-content':'content','change-reason':'reason','save-scope':'scope'};if(map[e.target.id])s.modal[map[e.target.id]]=e.target.value;});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.modal){e.preventDefault();closeModal();}else if(s.evidence){e.preventDefault();closeEvidence();}else if(s.drawer){e.preventDefault();s.drawer=false;O.render();document.getElementById('memory-trigger')?.focus({preventScroll:true});}return;}if(e.key==='Tab'&&s.evidence&&!s.modal){const d=document.querySelector('.evidence-drawer');const f=[...d.querySelectorAll('button:not(:disabled),input,select,textarea,[tabindex="0"]')];const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}if(e.key==='Enter'&&e.target.id==='memory-query'){e.preventDefault();act('search');}if(e.key==='Enter'&&e.target.id==='graph-question'){e.preventDefault();act('graph-question');}if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-action]')){e.preventDefault();act(e.target.dataset.action,e.target);}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.id==='chat-input'){e.preventDefault();act('chat-send');}});
