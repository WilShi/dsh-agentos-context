name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Node regression + client suites
        run: npm test
      - name: Strict typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify built host contract
        run: npm run verify:host
      - name: Verify built client contract
        run: npm run verify:client
      - name: Verify published package model
        run: npm run verify:package
      - name: Pack release archive
        run: npm run pack:release
      - name: Verify release archive
        run: npm run verify:archive
